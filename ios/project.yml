name: MediaEnhancer
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  MediaEnhancerApp:
    type: application
    platform: iOS
    sources:
      - path: MediaEnhancerApp
      - path: ../extension/src/shared/browser-api.js
        buildPhase: resources
      - path: ../extension/src/rules/ad-selectors.js
        buildPhase: resources
      - path: ../extension/src/content/adguard-yt-pruner.js
        buildPhase: resources
      - path: ../extension/src/content/ad-filter.js
        buildPhase: resources
      - path: ../extension/src/content/layout-enhancer.js
        buildPhase: resources
      - path: ../extension/src/content/media-enhancer.js
        buildPhase: resources
      - path: ../extension/src/content/main.js
        buildPhase: resources
      - path: ../extension/rules/content-blocker.json
        buildPhase: resources
    info:
      path: MediaEnhancerApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.mediaenhancer
        MARKETING_VERSION: "1.0.5"
        CURRENT_PROJECT_VERSION: "6"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "影音增強器"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      - sdk: WebKit.framework
      - sdk: SafariServices.framework

  MediaEnhancerExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: MediaEnhancerExtension
      - path: ../extension/manifest.json
        buildPhase: resources
      - path: ../extension/src
        type: folder
        buildPhase: resources
      - path: ../extension/rules
        type: folder
        buildPhase: resources
    info:
      path: MediaEnhancerExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.mediaenhancer.Extension
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: "NO"
    dependencies:
      - sdk: SafariServices.framework
